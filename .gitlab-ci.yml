workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - test
  - build
  - promote

node:test:
  stage: test
  image: node:22-bookworm-slim
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run typecheck

node:build:
  stage: build
  image: node:22-bookworm-slim
  needs: ["node:test"]
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run build

.github_publication_defaults:
  variables:
    GITHUB_MIRROR_URL: "git@github.com:snapetech/claude-code.git"
    GITHUB_REPOSITORY: "snapetech/claude-code"

# External publication is intentionally gated on all earlier GitLab stages.
# Set GITHUB_MIRROR_SSH_KEY, GITHUB_TOKEN, and GHCR_TOKEN in GitLab CI as needed.
github:mirror:
  extends: .github_publication_defaults
  stage: promote
  image: alpine:3.21
  before_script:
    - apk add --no-cache git openssh-client
    - eval "$(ssh-agent -s)"
    - printf '%s\n' "$GITHUB_MIRROR_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
  script:
    - test -n "$GITHUB_MIRROR_URL"
    - git remote add github-mirror "$GITHUB_MIRROR_URL"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        git push github-mirror "refs/tags/$CI_COMMIT_TAG:refs/tags/$CI_COMMIT_TAG"
      else
        git push github-mirror "HEAD:$CI_COMMIT_REF_NAME"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'

github:release:
  extends: .github_publication_defaults
  stage: promote
  image:
    name: ghcr.io/cli/cli:2.63.2
    entrypoint: [""]
  needs: ["github:mirror"]
  script:
    - test -n "$GITHUB_TOKEN"
    - test -n "$GITHUB_REPOSITORY"
    - gh release create "$CI_COMMIT_TAG" --repo "$GITHUB_REPOSITORY" --title "$CI_COMMIT_TAG" --notes "Unofficial Snapetech source-fork maintenance release; not an Anthropic release." --verify-tag
  rules:
    - if: '$CI_COMMIT_TAG'
